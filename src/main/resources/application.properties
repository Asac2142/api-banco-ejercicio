spring.application.name=web
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banco}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:andres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=validate
management.endpoints.web.exposure.include=health
spring.jpa.properties.jakarta.persistence.validation.mode=AUTO
logging.level.web.exception=INFO
logging.level.web.filter=INFO