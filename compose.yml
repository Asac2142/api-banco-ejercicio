services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: banco
      POSTGRES_USER: andres
      POSTGRES_PASSWORD: password
    volumes:
      - ./src/main/resources/BaseDatos.sql:/docker-entrypoint-initdb.d/BaseDatos.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andres -d banco"]
      interval: 10s
      timeout: 5s
      retries: 5